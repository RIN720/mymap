<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색 서비스</title>

  <!-- Kakao Map API 라이브러리 로드 (services 키워드 검색 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8ea5fe223fa7425d3811e11663af2e54&libraries=services"></script>

  <style>
    /* 全局 초기화 및 박스 모델 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 화면을 왼쪽(검색)과 오른쪽(지도) 2분할 레이아웃 설정 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 패널: 검색창 및 결과 리스트 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    /* 검색 영역 스타일 */
    .search-box {
      padding: 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e1e4e8;
    }

    .search-box h1 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 12px;
    }

    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #ffe812; /* 카카오 대표 노란색 포인트 */
    }

    .search-btn {
      padding: 10px 16px;
      background-color: #fee500; /* 카카오 브랜드 컬러 */
      color: #191919;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-btn:hover {
      background-color: #fada00;
    }

    /* 결과 리스트 영역 */
    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .result-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f1f3f5;
    }

    .result-title {
      font-size: 15px;
      font-weight: bold;
      color: #1b1c1d;
      margin-bottom: 4px;
    }

    .result-address {
      font-size: 13px;
      color: #666;
      margin-bottom: 2px;
    }

    .result-phone {
      font-size: 12px;
      color: #2b8a3e;
    }

    .no-result, .status-msg {
      text-align: center;
      color: #888;
      margin-top: 40px;
      font-size: 14px;
    }

    /* 오른쪽 패널: 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽: 검색창 및 결과 리스트 영역 -->
    <div class="sidebar">
      <div class="search-box">
        <h1>📍 장소 검색</h1>
        <form id="searchForm" class="search-form" onsubmit="return false;">
          <input type="text" id="keywordInput" class="search-input" placeholder="검색어를 입력하세요 (예: 맛집)" value="강남역 맛집">
          <button type="submit" id="searchBtn" class="search-btn">검색</button>
        </form>
      </div>
      <div id="resultsList" class="results-container">
        <p class="status-msg">지도를 불러오는 중입니다...</p>
      </div>
    </div>

    <!-- 오른쪽: 지도 영역 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // 전역 변수 선언
    let map = null;
    let placesService = null;
    let markers = [];
    let infoWindow = null;

    // 카카오맵 SDK가 완전히 로드된 후 실행하여 로딩 오류 방지
    kakao.maps.load(function () {
      initMap();
    });

    /**
     * 지도 및 서비스 초기화 함수
     */
    function initMap() {
      const mapContainer = document.getElementById('map'); // 지도를 표시할 div
      
      // 기본 위치 (위치 권한을 거부하거나 오류 발생 시 표시할 기본 위치: 서울시청)
      let defaultCenter = new kakao.maps.LatLng(37.566826, 126.978656);

      // 지도 옵션 설정 (확대 레벨 5)
      const mapOptions = {
        center: defaultCenter,
        level: 5 // 지도 확대 레벨
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 서비스 객체 및 인포윈도우 생성
      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 1 });

      // 사용자 위치 권한 요청 및 현재 위치 지도 설정
      getCurrentLocation();

      // 검색 이벤트 리스너 등록
      document.getElementById('searchForm').addEventListener('submit', handleSearch);
    }

    /**
     * 브라우저의 Geolocation API를 통해 현재 위치를 받아와 지도 중심을 변경하는 함수
     */
    function getCurrentLocation() {
      const resultsList = document.getElementById('resultsList');

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const currentPos = new kakao.maps.LatLng(lat, lng);

            // 지도의 중심을 현재 위치로 이동
            map.setCenter(currentPos);

            // 현재 위치에 마커 표시
            const currentMarker = new kakao.maps.Marker({
              position: currentPos,
              map: map
            });

            resultsList.innerHTML = '<p class="status-msg">현재 위치를 불러왔습니다. 검색어를 입력해주세요.</p>';
          },
          function (error) {
            console.warn('위치 권한을 얻지 못했습니다:', error.message);
            resultsList.innerHTML = '<p class="status-msg">위치 권한을 불러올 수 없어 기본 위치로 설정되었습니다.</p>';
          }
        );
      } else {
        resultsList.innerHTML = '<p class="status-msg">이 브라우저에서는 위치 서비스를 지원하지 않습니다.</p>';
      }
    }

    /**
     * 검색 버튼 클릭 또는 엔터 키 입력 시 실행되는 검색 처리 함수
     */
    function handleSearch() {
      const keyword = document.getElementById('keywordInput').value.trim();

      if (!keyword) {
        alert('검색어를 입력해주세요!');
        return;
      }

      // 카카오 키워드 검색 서비스 호출
      placesService.keywordSearch(keyword, placesSearchCallback);
    }

    /**
     * 카카오 장소 검색 완료 시 호출되는 콜백 함수
     */
    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        // 검색 성공 시 결과 리스트 및 마커 표시
        displaySearchResults(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('검색 결과가 존재하지 않습니다.');
        document.getElementById('resultsList').innerHTML = '<p class="no-result">검색 결과가 없습니다.</p>';
        removeMarkers();
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    /**
     * 검색 결과 목록과 마커를 화면에 출력하는 함수
     */
    function displaySearchResults(places) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = ''; // 기존 목록 초기화

      // 기존 지도 위 마커 제거
      removeMarkers();

      // 지도 범위를 재설정하기 위한 Bounds 객체 생성
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach((place, index) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 마커 생성 및 지도 표시
        const marker = new kakao.maps.Marker({
          position: placePosition,
          map: map
        });

        markers.push(marker);
        bounds.extend(placePosition);

        // 검색 결과 아이템 HTML 생성
        const itemEl = document.createElement('div');
        itemEl.className = 'result-item';
        itemEl.innerHTML = `
          <div class="result-title">${index + 1}. ${place.place_name}</div>
          <div class="result-address">${place.road_address_name || place.address_name}</div>
          ${place.phone ? `<div class="result-phone">📞 \${place.phone}</div>` : ''}
        `;

        // 마커와 목록 아이템 클릭 시 인포윈도우 표시 이벤트 등록
        kakao.maps.event.addListener(marker, 'click', function () {
          displayInfoWindow(marker, place.place_name);
        });

        itemEl.addEventListener('click', function () {
          map.panTo(placePosition);
          displayInfoWindow(marker, place.place_name);
        });

        resultsList.appendChild(itemEl);
      });

      // 검색된 모든 장소가 보이도록 지도 범위 재설정
      map.setBounds(bounds);
    }

    /**
     * 마커 클릭 시 장소명을 보여주는 인포윈도우 함수
     */
    function displayInfoWindow(marker, title) {
      const content = `<div style="padding:6px 12px;font-size:13px;font-weight:bold;color:#333;">${title}</div>`;
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    /**
     * 기존 지도에 표시된 마커들을 모두 삭제하는 함수
     */
    function removeMarkers() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
    }
  </script>
</body>
</html>
