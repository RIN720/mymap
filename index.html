<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>굿즈샵 · 소품샵 지도</title>

  <!-- Kakao Map API 라이브러리 로드 (services: 장소 검색 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8ea5fe223fa7425d3811e11663af2e54&libraries=services"></script>

  <style>
    /* 전역 초기화 및 박스 모델 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 화면을 왼쪽(검색)과 오른쪽(지도) 2분할 레이아웃 */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 왼쪽 패널 */
    .sidebar {
      width: 380px;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
      z-index: 10;
      box-shadow: 2px 0 8px rgba(0,0,0,0.05);
    }

    /* 상단 검색 영역 */
    .search-box {
      padding: 20px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e1e4e8;
    }

    .search-box h1 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 12px;
    }

    /* 탭 버튼 영역 */
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #e1e4e8;
      background-color: #ffffff;
      color: #555;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background-color: #f1f3f5;
    }

    /* 굿즈샵 탭 활성화: 보라색 */
    .tab-btn[data-tab="goods"].active {
      background-color: #8b5cf6;
      border-color: #8b5cf6;
      color: #ffffff;
    }

    /* 소품샵 탭 활성화: 분홍색 */
    .tab-btn[data-tab="props"].active {
      background-color: #ec4899;
      border-color: #ec4899;
      color: #ffffff;
    }

    /* 자유 검색창 */
    .search-form {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #ffe812;
    }

    .search-btn {
      padding: 10px 16px;
      background-color: #fee500;
      color: #191919;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-btn:hover {
      background-color: #fada00;
    }

    /* 결과 리스트 영역 */
    .results-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .results-header {
      font-size: 13px;
      color: #555;
      font-weight: bold;
      padding: 4px 6px 10px;
    }

    .result-item {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #eee;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #f1f3f5;
    }

    /* 선택된 리스트 항목 강조 */
    .result-item.active {
      background-color: #fff8db;
    }

    /* 리스트 왼쪽의 색깔 점 (마커 색과 동일) */
    .result-dot {
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      border-radius: 50%;
    }

    .result-body {
      flex: 1;
      min-width: 0;
    }

    .result-title {
      font-size: 15px;
      font-weight: bold;
      color: #1b1c1d;
      margin-bottom: 4px;
    }

    .result-address {
      font-size: 13px;
      color: #666;
      margin-bottom: 2px;
    }

    .result-phone {
      font-size: 12px;
      color: #2b8a3e;
    }

    .result-distance {
      font-size: 12px;
      color: #3b82f6;
      margin-top: 2px;
    }

    .no-result, .status-msg {
      text-align: center;
      color: #888;
      margin-top: 40px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 찾지 못한 가게 안내 */
    .missing-note {
      margin-top: 16px;
      padding: 12px;
      background-color: #f8f9fa;
      border-radius: 6px;
      font-size: 12px;
      color: #888;
      line-height: 1.5;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 내 위치 파란 점 */
    .my-location-dot {
      position: relative;
      width: 18px;
      height: 18px;
      background-color: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    /* 파란 점 주변에 퍼지는 효과 */
    .my-location-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border-radius: 50%;
      background-color: rgba(59, 130, 246, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* 마커 클릭 시 뜨는 상세정보 팝업 */
    .place-popup {
      position: relative;
      width: 250px;
      margin-bottom: 54px; /* 마커 위로 띄우기 */
      padding: 14px 16px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      font-size: 13px;
      color: #333;
    }

    /* 팝업 아래 말풍선 꼬리 */
    .place-popup::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      margin-left: -8px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent;
    }

    .popup-close {
      position: absolute;
      top: 6px;
      right: 8px;
      border: none;
      background: none;
      font-size: 18px;
      color: #999;
      cursor: pointer;
    }

    .popup-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 2px;
      padding-right: 20px;
    }

    .popup-category {
      font-size: 11px;
      color: #999;
      margin-bottom: 8px;
    }

    .popup-row {
      margin-bottom: 4px;
      line-height: 1.4;
      word-break: keep-all;
    }

    .popup-sub {
      font-size: 11px;
      color: #999;
      margin: -2px 0 4px 18px;
    }

    .popup-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #3b82f6;
      text-decoration: none;
    }

    /* 화면이 좁을 때(모바일): 위는 지도, 아래는 리스트 */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 50%;
        border-right: none;
        border-top: 1px solid #e1e4e8;
      }
      .map-container {
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 왼쪽: 탭, 검색창, 결과 리스트 -->
    <div class="sidebar">
      <div class="search-box">
        <h1>📍 굿즈샵 · 소품샵 지도</h1>

        <!-- 탭 버튼 -->
        <div class="tab-group">
          <button type="button" class="tab-btn" data-tab="goods">🎁 굿즈샵</button>
          <button type="button" class="tab-btn" data-tab="props">🧸 소품샵</button>
        </div>

        <!-- 자유 검색 -->
        <form id="searchForm" class="search-form">
          <input type="text" id="keywordInput" class="search-input" placeholder="직접 검색 (예: 문구점)">
          <button type="submit" class="search-btn">검색</button>
        </form>
      </div>

      <div id="resultsList" class="results-container">
        <p class="status-msg">지도를 불러오는 중입니다...</p>
      </div>
    </div>

    <!-- 오른쪽: 지도 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // ===== 설정값 =====

    // 굿즈샵 탭에서 검색할 가게 이름 목록
    const GOODS_SHOP_NAMES = [
      '유미상점', '쿠지뽑고가냥', '덕중무휴', '이치라쿠', '나폴나폴', '홍키하바라',
      '가챠오션 홍대점', '시로가챠', '토리모상점', '라신반 서울본점', '피규어센터 2호점',
      '본부대로', '오타쿠만물상', '꾸잉양판점', '애니플라자', '숨겨진상점', '덕모클',
      '지지코믹마켓 홍대점', '도리무란도', '쿠지매니아 홍대점', '라스트원 홍대', '코지쿠지',
      '호카상점', '냐냐랜드', '피규어센터 1호점', '오카에리', '쿠쿠 스페이스', '푸숍',
      '메리모어', '두니부', '가챠오션플러스 연남점', '츄플레이', '연도문구', '도담도담',
      '애니세카이 홍대점', '라신반 서울 1호점', '아이러브토이즈 홍대점', '더쿠 연트럴파크점',
      '브라더굿즈 홍대', '피규어프레소 신도림점', '피규어프렌즈', '최애굿즈 홍대점', '안서당',
      '더키월드', '모와즐 홍대점', '더꼬꼬굿즈', '원피규어', '오모차랜드 홍대2호점',
      '애니플러스 서울합정점', '오모차랜드 홍대점', '헬로수미코', '더쿠 홍대입구점',
      '피규어프레소 에프피점', '레인몰'
    ];

    // 탭별 설정 (이름, 마커 색)
    const TAB_CONFIG = {
      goods: { label: '굿즈샵', color: '#8b5cf6' }, // 보라
      props: { label: '소품샵', color: '#ec4899', keyword: '소품샵' } // 분홍
    };

    const FREE_SEARCH_COLOR = '#f59e0b'; // 자유 검색 마커 색 (주황)
    const GOODS_BATCH_SIZE = 5;          // 굿즈샵을 한 번에 몇 개씩 검색할지
    const PROPS_SEARCH_RADIUS = 5000;    // 소품샵 검색 반경 (m)

    // ===== 전역 변수 =====
    let map = null;
    let placesService = null;
    let markers = [];
    let placePopup = null;        // 상세정보 팝업 (커스텀 오버레이)
    let myLocationOverlay = null; // 내 위치 파란 점
    let userPosition = null;      // 내 위치 좌표
    let locationReady = null;     // 위치 확인이 끝나면 완료되는 Promise
    let currentRequestId = 0;     // 탭을 빠르게 바꿀 때 예전 결과가 섞이지 않게 하는 번호
    let defaultCenter = null;     // 위치 권한이 없을 때 쓸 기본 위치 (서울시청)
    let goodsSearchCenter = null; // 굿즈샵 이름 검색 기준점 (홍대입구역)

    // 카카오맵 SDK가 완전히 로드된 후 실행
    kakao.maps.load(function () {
      initMap();
    });

    /**
     * 지도 및 서비스 초기화
     */
    function initMap() {
      defaultCenter = new kakao.maps.LatLng(37.566826, 126.978656);
      goodsSearchCenter = new kakao.maps.LatLng(37.557527, 126.924467);

      map = new kakao.maps.Map(document.getElementById('map'), {
        center: defaultCenter,
        level: 5
      });

      placesService = new kakao.maps.services.Places();

      // 상세정보 팝업 오버레이 (clickable: 팝업 클릭이 지도 클릭으로 넘어가지 않게)
      placePopup = new kakao.maps.CustomOverlay({
        xAnchor: 0.5,
        yAnchor: 1,
        zIndex: 3,
        clickable: true
      });

      // 지도 빈 곳을 누르면 팝업 닫기
      kakao.maps.event.addListener(map, 'click', closePopup);

      // 창 크기가 바뀌면 지도 크기 다시 계산
      window.addEventListener('resize', () => map.relayout());

      // 탭 버튼 이벤트 등록
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => handleTabClick(btn.dataset.tab));
      });

      // 자유 검색 이벤트 등록
      document.getElementById('searchForm').addEventListener('submit', handleFreeSearch);

      // 내 위치 확인 시작
      locationReady = initUserLocation();
    }

    /**
     * 내 위치를 받아와 파란 점으로 표시 (완료되면 Promise가 끝남)
     */
    function initUserLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) {
          showInitialMessage('이 브라우저는 위치 서비스를 지원하지 않아요.<br>서울시청 기준으로 검색합니다.');
          resolve(null);
          return;
        }

        navigator.geolocation.getCurrentPosition(
          function (position) {
            userPosition = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
            map.setCenter(userPosition);
            showMyLocationDot(userPosition);
            showInitialMessage('현재 위치를 불러왔어요.<br>위의 탭을 눌러보세요!');
            resolve(userPosition);
          },
          function (error) {
            console.warn('위치 권한을 얻지 못했습니다:', error.message);
            showInitialMessage('위치를 불러올 수 없어 서울시청 기준으로 검색합니다.<br>위의 탭을 눌러보세요!');
            resolve(null);
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      });
    }

    /**
     * 내 위치에 파란 점 표시
     */
    function showMyLocationDot(position) {
      const dotEl = document.createElement('div');
      dotEl.className = 'my-location-dot';
      dotEl.title = '내 위치';

      myLocationOverlay = new kakao.maps.CustomOverlay({
        position: position,
        content: dotEl,
        xAnchor: 0.5,
        yAnchor: 0.5,
        zIndex: 2
      });
      myLocationOverlay.setMap(map);
    }

    /**
     * 탭 클릭 처리
     */
    async function handleTabClick(tabKey) {
      const requestId = ++currentRequestId;
      const config = TAB_CONFIG[tabKey];

      setActiveTab(tabKey);
      clearResults();
      showStatus('내 위치를 확인하는 중...');

      await locationReady;
      if (requestId !== currentRequestId) return; // 그 사이 다른 탭을 눌렀으면 중단

      let result;
      if (tabKey === 'goods') {
        result = await searchGoodsShops(requestId);
      } else {
        result = await searchPropShops(requestId, config.keyword);
      }
      if (!result || requestId !== currentRequestId) return;

      const sortedPlaces = sortByDistance(result.places);
      const header = `${config.label} ${sortedPlaces.length}곳 · 가까운 순`;
      displayPlaces(sortedPlaces, config.color, header, result.missingNames);
    }

    /**
     * 굿즈샵: 이름 목록을 몇 개씩 나눠서 검색
     */
    async function searchGoodsShops(requestId) {
      const places = [];
      const missingNames = [];
      const seenIds = new Set(); // 같은 가게가 두 번 나오지 않게

      for (let i = 0; i < GOODS_SHOP_NAMES.length; i += GOODS_BATCH_SIZE) {
        if (requestId !== currentRequestId) return null;

        const batchNames = GOODS_SHOP_NAMES.slice(i, i + GOODS_BATCH_SIZE);
        const batchResults = await Promise.all(batchNames.map(findGoodsShop));

        batchResults.forEach((place, index) => {
          if (!place) {
            missingNames.push(batchNames[index]);
          } else if (!seenIds.has(place.id)) {
            seenIds.add(place.id);
            places.push(place);
          }
        });

        const doneCount = Math.min(i + GOODS_BATCH_SIZE, GOODS_SHOP_NAMES.length);
        showStatus(`굿즈샵 찾는 중... (${doneCount}/${GOODS_SHOP_NAMES.length})`);
      }

      return { places, missingNames };
    }

    /**
     * 가게 이름 하나로 검색해서 이름이 맞는 장소 하나를 고름
     */
    async function findGoodsShop(name) {
      const { data, status } = await keywordSearchAsync(name, {
        location: goodsSearchCenter, // 대부분 홍대 근처라서 홍대 기준으로 검색
        radius: 20000,               // 최대 반경 20km
        size: 5
      });

      if (status !== kakao.maps.services.Status.OK) return null;

      const target = normalizeName(name);

      // 음식점(FD6)은 제외하고, 이름이 서로 포함되는 장소만 인정
      return data.find(place => {
        if (place.category_group_code === 'FD6') return false;
        const placeName = normalizeName(place.place_name);
        return placeName.includes(target) || target.includes(placeName);
      }) || null;
    }

    /**
     * 소품샵: 내 위치 주변을 거리순으로 최대 3페이지(45곳) 검색
     */
    async function searchPropShops(requestId, keyword) {
      const places = [];

      for (let page = 1; page <= 3; page++) {
        showStatus(`${keyword} 찾는 중... (${page}페이지)`);

        const { data, status, pagination } = await keywordSearchAsync(keyword, {
          location: getSearchCenter(),
          radius: PROPS_SEARCH_RADIUS,
          sort: kakao.maps.services.SortBy.DISTANCE,
          page: page
        });

        if (requestId !== currentRequestId) return null;
        if (status !== kakao.maps.services.Status.OK) break;

        places.push(...data);
        if (!pagination.hasNextPage) break;
      }

      return { places, missingNames: [] };
    }

    /**
     * 자유 검색창 처리
     */
    async function handleFreeSearch(event) {
      event.preventDefault();
      const keyword = document.getElementById('keywordInput').value.trim();

      if (!keyword) {
        alert('검색어를 입력해주세요!');
        return;
      }

      const requestId = ++currentRequestId;
      setActiveTab(null); // 탭 선택 해제
      clearResults();
      showStatus(`'${escapeHtml(keyword)}' 검색 중...`);

      await locationReady;
      const { data, status } = await keywordSearchAsync(keyword, {
        location: getSearchCenter(),
        sort: kakao.maps.services.SortBy.ACCURACY
      });
      if (requestId !== currentRequestId) return;

      if (status === kakao.maps.services.Status.ERROR) {
        showStatus('검색 중 오류가 발생했어요.');
        return;
      }

      const places = status === kakao.maps.services.Status.OK ? data : [];
      displayPlaces(places, FREE_SEARCH_COLOR, `'${keyword}' 검색 결과 ${places.length}곳`);
    }

    /**
     * 장소 목록을 지도 마커 + 왼쪽 리스트로 표시
     */
    function displayPlaces(places, markerColor, headerText, missingNames = []) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      if (places.length === 0) {
        resultsList.innerHTML = '<p class="no-result">검색 결과가 없어요.</p>';
        return;
      }

      const headerEl = document.createElement('p');
      headerEl.className = 'results-header';
      headerEl.textContent = headerText;
      resultsList.appendChild(headerEl);

      const markerImage = createMarkerImage(markerColor);
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach((place, index) => {
        const position = new kakao.maps.LatLng(place.y, place.x);

        // 색깔 마커 생성
        const marker = new kakao.maps.Marker({
          position: position,
          map: map,
          title: place.place_name,
          image: markerImage
        });
        markers.push(marker);
        bounds.extend(position);

        // 리스트 항목 생성
        const itemEl = createResultItem(place, index, markerColor);

        // 마커 클릭 → 상세정보 팝업
        kakao.maps.event.addListener(marker, 'click', function () {
          selectPlace(place, position, itemEl);
        });

        // 리스트 클릭 → 지도 이동 + 상세정보 팝업
        itemEl.addEventListener('click', function () {
          map.panTo(position);
          selectPlace(place, position, itemEl);
        });

        resultsList.appendChild(itemEl);
      });

      // 찾지 못한 가게가 있으면 아래에 안내
      if (missingNames.length > 0) {
        const noteEl = document.createElement('div');
        noteEl.className = 'missing-note';
        noteEl.textContent = `카카오맵에서 찾지 못한 곳 (${missingNames.length}): ${missingNames.join(', ')}`;
        resultsList.appendChild(noteEl);
      }

      // 모든 마커가 보이도록 지도 범위 조정
      map.setBounds(bounds);
    }

    /**
     * 리스트 항목 하나의 HTML 요소 생성
     */
    function createResultItem(place, index, color) {
      const itemEl = document.createElement('div');
      itemEl.className = 'result-item';

      const address = place.road_address_name || place.address_name;
      const distanceText = (userPosition && place.distanceMeters != null)
        ? `<div class="result-distance">🚶 ${formatDistance(place.distanceMeters)}</div>`
        : '';

      itemEl.innerHTML = `
        <span class="result-dot" style="background-color:${color}"></span>
        <div class="result-body">
          <div class="result-title">${index + 1}. ${escapeHtml(place.place_name)}</div>
          <div class="result-address">${escapeHtml(address)}</div>
          ${place.phone ? `<div class="result-phone">📞 ${escapeHtml(place.phone)}</div>` : ''}
          ${distanceText}
        </div>
      `;
      return itemEl;
    }

    /**
     * 장소 선택: 팝업 열기 + 리스트 항목 강조
     */
    function selectPlace(place, position, itemEl) {
      openPlacePopup(place, position);

      document.querySelectorAll('.result-item.active').forEach(el => el.classList.remove('active'));
      itemEl.classList.add('active');
      itemEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    /**
     * 상세정보 팝업 (이름, 분류, 주소, 전화번호, 카카오맵 링크)
     */
    function openPlacePopup(place, position) {
      const roadAddress = place.road_address_name;
      const jibunAddress = place.address_name;
      const mainAddress = roadAddress || jibunAddress;
      const category = (place.category_name || '').split('>').pop().trim();

      const popupEl = document.createElement('div');
      popupEl.className = 'place-popup';
      popupEl.innerHTML = `
        <button type="button" class="popup-close" aria-label="닫기">×</button>
        <div class="popup-title">${escapeHtml(place.place_name)}</div>
        ${category ? `<div class="popup-category">${escapeHtml(category)}</div>` : ''}
        <div class="popup-row">📍 ${escapeHtml(mainAddress)}</div>
        ${roadAddress && jibunAddress && roadAddress !== jibunAddress
          ? `<div class="popup-sub">(지번) ${escapeHtml(jibunAddress)}</div>` : ''}
        <div class="popup-row">📞 ${place.phone ? escapeHtml(place.phone) : '전화번호 정보 없음'}</div>
        ${place.place_url
          ? `<a class="popup-link" href="${escapeHtml(place.place_url)}" target="_blank" rel="noopener">카카오맵에서 자세히 보기 →</a>`
          : ''}
      `;
      popupEl.querySelector('.popup-close').addEventListener('click', closePopup);

      placePopup.setContent(popupEl);
      placePopup.setPosition(position);
      placePopup.setMap(map);
    }

    function closePopup() {
      placePopup.setMap(null);
    }

    // ===== 도우미 함수들 =====

    /**
     * 카카오 키워드 검색을 Promise로 감싸서 await로 쓸 수 있게 함
     */
    function keywordSearchAsync(keyword, options) {
      return new Promise(resolve => {
        placesService.keywordSearch(keyword, (data, status, pagination) => {
          resolve({ data, status, pagination });
        }, options);
      });
    }

    /**
     * 원하는 색의 마커 이미지(SVG) 생성
     */
    function createMarkerImage(color) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="46" viewBox="-2 -2 36 46">
          <path d="M16 0C7.2 0 0 7.2 0 16c0 12 16 26 16 26s16-14 16-26C32 7.2 24.8 0 16 0z"
                fill="${color}" stroke="#ffffff" stroke-width="2"/>
          <circle cx="16" cy="16" r="6" fill="#ffffff"/>
        </svg>`;
      const imageSrc = 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);

      return new kakao.maps.MarkerImage(
        imageSrc,
        new kakao.maps.Size(36, 46),
        { offset: new kakao.maps.Point(18, 46) } // 마커 끝부분이 좌표를 가리키도록
      );
    }

    /**
     * 검색 기준 위치 (내 위치가 없으면 서울시청)
     */
    function getSearchCenter() {
      return userPosition || defaultCenter;
    }

    /**
     * 각 장소에 거리(m)를 붙이고 가까운 순으로 정렬
     */
    function sortByDistance(places) {
      const center = getSearchCenter();
      places.forEach(place => {
        place.distanceMeters = getDistance(center.getLat(), center.getLng(), Number(place.y), Number(place.x));
      });
      return places.sort((a, b) => a.distanceMeters - b.distanceMeters);
    }

    /**
     * 두 좌표 사이 거리(m) 계산 (하버사인 공식)
     */
    function getDistance(lat1, lng1, lat2, lng2) {
      const earthRadius = 6371000;
      const toRad = deg => deg * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * earthRadius * Math.asin(Math.sqrt(a));
    }

    function formatDistance(meters) {
      return meters < 1000 ? `${Math.round(meters)}m` : `${(meters / 1000).toFixed(1)}km`;
    }

    /**
     * 이름 비교용: 공백 제거 + 소문자
     */
    function normalizeName(name) {
      return name.replace(/\s+/g, '').toLowerCase();
    }

    /**
     * HTML 특수문자 처리 (장소 이름에 < > 등이 있어도 화면이 깨지지 않게)
     */
    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    /**
     * 탭 버튼 활성화 표시 (null이면 모두 해제)
     */
    function setActiveTab(tabKey) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabKey);
      });
    }

    /**
     * 기존 마커, 팝업, 리스트 모두 지우기
     */
    function clearResults() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];
      closePopup();
      document.getElementById('resultsList').innerHTML = '';
    }

    function showStatus(message) {
      document.getElementById('resultsList').innerHTML = `<p class="status-msg">${message}</p>`;
    }

    /**
     * 처음 안내 문구 (이미 탭 검색을 시작했으면 덮어쓰지 않음)
     */
    function showInitialMessage(message) {
      if (currentRequestId === 0) showStatus(message);
    }
  </script>
</body>
</html>
